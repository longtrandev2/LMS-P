spring:
  application:
    name: lms-worker
  main:
    web-application-type: none
    keep-alive: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lms}
    password: ${RABBITMQ_PASSWORD:lms}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${WORKER_PREFETCH:2}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/lms?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:lms_worker}
    password: ${MYSQL_PASSWORD:lmsp_worker_local_only}

lms:
  grading:
    runner-image: ${GRADER_IMAGE:lmsp-grader:local}
    job-timeout-seconds: ${GRADING_JOB_TIMEOUT_SECONDS:120}
