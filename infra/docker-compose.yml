# LMS-P — full stack compose (phase-00-5)
# Run from infra/:  docker compose up -d --build
# Env comes from ../.env (copy ../.env.example first).
#
# NOTE: `api` and `web` build contexts point at ../apps/api and ../apps/web.
# Their Dockerfiles land with the API/web phases (parallel agents) — until then
# `docker compose up --build` will fail on those two services; mysql/rabbitmq/worker
# are ready. See README.md.
#
# Worker sandbox (P3): worker mounts the Docker socket to spawn one-shot grading
# containers. On Docker Desktop for Windows (WSL2 backend) /var/run/docker.sock is
# exposed inside the VM and this works. Fallback if it doesn't on your machine:
# run the worker host-side (see README "Chạy worker ngoài compose").

name: lms

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306" # host access for dev tools; remove in real deployments
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [lms-internal]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lms}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [lms-internal]

  api:
    build: ../apps/api
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lms}:${MYSQL_PASSWORD:-lms}@mysql:3306/${MYSQL_DATABASE:-lms}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lms}:${RABBITMQ_PASS:-lms}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate one in .env (python -c "import secrets;print(secrets.token_urlsafe(48))")}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - ../storage:/app/storage
      # Seed: docker compose exec api python /app/scripts/seed.py
      - ../scripts:/app/scripts
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [lms-internal]

  worker:
    build: ../apps/worker
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-lms}:${MYSQL_PASSWORD:-lms}@mysql:3306/${MYSQL_DATABASE:-lms}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-lms}:${RABBITMQ_PASS:-lms}@rabbitmq:5672/
    volumes:
      # P3 sandbox: spawn one-shot grading containers on the host Docker daemon.
      # Works on Docker Desktop WSL2. Fallback (dev): run worker host-side — README.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [lms-internal]
    # Scale before exams: docker compose up -d --scale worker=4

  web:
    build:
      context: ../apps/web
      # NEXT_PUBLIC_* là build-time vars — phải qua build args, không phải runtime env
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [lms-internal]

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks: [lms-internal]

volumes:
  mysql-data:
  rabbitmq-data:

networks:
  lms-internal:
