name: lms
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms}
    volumes: [mysql-data:/var/lib/mysql]
    ports: ["${MYSQL_BIND_ADDRESS:-127.0.0.1}:3308:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [lms-internal]
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-lms}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [lms-internal]
  api:
    build: ../apps/api
    environment:
      SERVER_PORT: 8000
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lms}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-lms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-lms}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — configure a random secret in infra/.env}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes: [../storage:/app/storage]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [lms-internal]
  worker:
    build: ../apps/worker
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lms}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_WORKER_USER:-lms_worker}
      MYSQL_PASSWORD: ${MYSQL_WORKER_PASSWORD:-lmsp_worker_local_only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-lms}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-2}
      GRADER_IMAGE: lmsp-grader:local
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Trusted worker only: access to Docker daemon is equivalent to host-level control.
    # Never mount this socket into the API or a grading sandbox.
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      worker-db-permissions: {condition: service_completed_successfully}
      grader-image: {condition: service_completed_successfully}
    networks: [lms-internal]
  worker-db-permissions:
    image: mysql:8.4
    entrypoint: ["bash", "/grant-worker-readonly.sh"]
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_WORKER_USER: ${MYSQL_WORKER_USER:-lms_worker}
      MYSQL_WORKER_PASSWORD: ${MYSQL_WORKER_PASSWORD:-lmsp_worker_local_only}
    volumes: [./mysql/grant-worker-readonly.sh:/grant-worker-readonly.sh:ro]
    network_mode: "service:mysql"
    depends_on:
      mysql: {condition: service_healthy}
  grader-image:
    image: lmsp-grader:local
    build:
      context: ../apps/worker/grader
    entrypoint: ["/bin/true"]
    networks: [lms-internal]
  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    networks: [lms-internal]
  nginx:
    image: nginx:alpine
    profiles: [prod]
    ports: ["80:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api, web]
    networks: [lms-internal]
volumes:
  mysql-data:
  rabbitmq-data:
networks:
  lms-internal:
